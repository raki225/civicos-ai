services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: civicos
      POSTGRES_USER: civicos
      POSTGRES_PASSWORD: civicos
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicos"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - civic-db:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"

  api:
    build: ./apps/api
    env_file: .env
    environment:
      CIVICOS_DATABASE_URL: postgresql+psycopg://civicos:civicos@db:5432/civicos
      CIVICOS_UPLOAD_DIR: /data/uploads
    volumes:
      - civic-uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  civic-db:
  civic-uploads:

